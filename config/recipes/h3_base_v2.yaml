# Recipe: the fixed generation settings shared by all shots that name it.
# v2 = v1 + PyTorch attention (decision D16, owner-approved 2026-10-24).
# Values = official H3 templates (templates 0.11.89) except the fp16 video VAE (decision D5).
# Change a recipe only by creating a new version file (h3_base_v2.yaml) + a decision-log entry,
# so old takes stay reproducible.
name: h3_base_v2
created: "2026-10-24"   # quoted: unquoted YAML dates become date objects
sampler: res_multistep
scheduler: simple
steps: 20
fps: 24
bit_depth: 8
attention: pytorch      # ComfyUI started with --use-pytorch-cross-attention (D16)
ref_image_size: match   # R2V only: 'match' = refs scaled down to the video's pixel area
models:
  fl2va: minimax_h3_fl2va_pruned_int8_convrot.safetensors     # t2v, i2v, flf2v
  ref2va: minimax_h3_ref2va_pruned_int8_convrot.safetensors   # r2v
  clip: qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  video_vae: minimax_h3_video_vae_fp16.safetensors            # D5: int8 VAE crashes on MPS
  audio_vae: minimax_h3_audio_vae_fp32.safetensors
