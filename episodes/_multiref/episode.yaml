# To-do #6/#12 (owner 2026-10-26): re-test multi-reference R2V (person + location) in H3's official Ref2VA
# format (h3-prompt-writing: a location is its own <Subject N>, like the guide's "coffee-shop environment"
# example) with the direction skill. Earlier, in the old free-text format (episodes/_location, recipe v1):
#   L1 desk + room plate: room kept, but the camera pulled back to a side view, face 47 px, quality 0.17
#   L2 window + room plate: opened on the exact plate, then she was seen from behind
#   L0 control (no plate): face 94 px, quality 0.37, room invented
# M1/M2 = L1/L2 rewritten (same references); M3 = Lin + an H3 park plate (A3 s31, episodes/_stills).
# Question: does the official format keep BOTH the room and a large, front-facing face?
# check-plan reports errors for two-reference R2V and plates as references (S005/L1/L2 lessons): expected
# here, this episode tests exactly that. Render with: scripts/episode.py render episodes/_multiref
episode: _multiref
title: Multi-reference re-test (person + location, official format)
recipe: h3_base_v2
defaults:
  aspect: '9:16'
  megapixels: 0.4
  duration: 3.75
  takes: 2
  max_rerolls: 0
