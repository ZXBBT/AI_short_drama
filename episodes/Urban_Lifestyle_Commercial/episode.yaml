# "Be a Little Braver" (16:9 commercial), shot list drafted by Claude 2026-10-24 from the owner's guide
# Urban_Lifestyle_Commercial_Recreation_Guide_EN.md (via brief.yaml); owner asked to generate directly.
# Same header as scripts/brief.py scaffold would write, plus 16:9 and the product as an object reference.
# Rules applied: one R2V reference per shot (the man OR the can); faces at medium close-up or closer, wides
# show him small/from behind; 864x480 (0.4 MP) and <= 3.75 s per shot (proven sizes); prompts in H3's
# official format (h3-prompt-writing skill); narration word for word as off-screen voice-over in <d>;
# quoted text = text that must be visible (the can, the SUPER DRY CLUB title) and nothing else.
# Limits we cannot avoid with H3 alone: every shot generates its own voice and music, so the narrator's
# voice and the music theme are similar, not identical, from shot to shot.
episode: Urban_Lifestyle_Commercial
title: Be a Little Braver
recipe: h3_base_v2
defaults:
  aspect: '16:9'
  megapixels: 0.4      # 864x480
  duration: 3
  takes: 2
  max_rerolls: 1
review:
  picks: auto
  final: true
assets:
  char_man_1: inputs/Urban_Lifestyle_Commercial/ref_man_v1.png
  char_can_1: inputs/Urban_Lifestyle_Commercial/ref_can_v1.png
  subway_wide_v1: inputs/Urban_Lifestyle_Commercial/subway_wide_v1.png    # V2 geometry still (refs R3 s31)
  subway_close_v1: inputs/Urban_Lifestyle_Commercial/subway_close_v1.png  # V2 geometry still (refs R4 s42)
characters:
  man:
    description: a Chinese man about 26 years old with a lean but healthy build, natural short black hair, a clean-shaven
      face, straight dark eyebrows and fresh, ordinary, approachable features, wearing a plain gray crew-neck T-shirt
      under an unbuttoned dark blue-gray casual overshirt, black straight-leg trousers and white sneakers
    refs: [char_man_1]
    voice: male narrator, 25-30, clean, natural, slightly low-pitched, relaxed and reflective
  can:
    kind: object
    description: a 500 ml aluminum beer can with a blue top and lid, a silver-white metallic body, small blue letters
      "BRAVE THE WORLD" near the top, large bold blue letters "SUPER DRY" across the middle and a red label block
      reading "SUPER DRY DRAFT BEER"
    refs: [char_can_1]
  woman:
    description: a Chinese woman in her late twenties with long straight dark hair in a natural side part, minimal
      makeup and a warm, understated expression, wearing a loose beige T-shirt under a muted brown pinafore dress

