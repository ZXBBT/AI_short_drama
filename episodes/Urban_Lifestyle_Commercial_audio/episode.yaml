    prompt: |-
      integrated_multimodal_description: [Shot 1] Live-action, a static shot of a warm, lamp-lit apartment room in the evening with bookshelves and a desk.

      overall_soundscape: Quiet domestic room tone with a very soft air-conditioner hum and faint distant city sound through a closed window, with no voices.

      non_diegetic_music: N/A
  N2b:
    type: t2v
    audio_anchor: n1_tail
    seed: 13
    duration: 15
    note: narrator lines 4-7 as a continuation of N1's own recording (first ~4.3 s = end of N1), for one consistent voice
    prompt: |-
      integrated_multimodal_description: [Shot 1] Live-action, a static shot of an empty, dimly lit room with plain gray walls; nothing moves and nobody is visible. The recording continues from the same male narrator in his late twenties, with the same clean, natural, slightly low-pitched voice, relaxed, reflective and quietly confident, speaking at an unhurried pace close to the microphone (S1). He first finishes his line, says in an off-screen voiceover: <d>[English] After I started working, I realized...</d> After a pause of about one second, the same narrator (S1) says in an off-screen voiceover: <d>[English] Every day brings more new work.</d> After a pause of about one second, the same narrator (S1) says in an off-screen voiceover: <d>[English] Not new people.</d> After a pause of about two seconds, the same narrator (S1) says in an off-screen voiceover: <d>[English] Then I thought...</d> After a pause of about one second, the same narrator (S1) says in an off-screen voiceover: <d>[English] Maybe I don't need to be someone else.</d> Then the room stays silent until the end.

