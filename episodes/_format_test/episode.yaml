      [Shot 1] A medium close-up frames <Subject 1> from the chest up, sitting on a wooden park bench and turned slightly toward the left of the frame; her face fills a large part of the frame and is in sharp focus. She wears her plain white T-shirt, its soft cotton creasing slightly at the shoulders, and black trousers on her lap at the lower edge of the frame; her long straight dark hair with bangs falls over her shoulders, a few strands lifting in the breeze and catching warm light. The weathered wooden slats of the bench back show behind her shoulder, with a fine grain and a few sunlit spots. Warm afternoon sun comes from the upper right, giving her face soft, even light with a gentle highlight on her cheek and a natural shadow under her chin. Behind her, softly out of focus, a tree-lined path with green leaves and patches of sunlight stretches away; far down the path, a man walks a small dog and a woman jogs past later at her own pace, both small, blurred and with stable silhouettes. Leaf shadows drift slowly across her face and shoulders in a light breeze. She holds a black smartphone in both hands at chest height, its screen facing her and away from the camera. Her eyes are on the screen and read in small left-to-right movements; she blinks once. Her thumb scrolls once. Her eyes stop on one line; she pauses for a moment, her eyebrows lift very slightly, and the corners of her mouth begin to rise. The smile spreads slowly and naturally, her cheeks lift and the skin around her eyes creases softly; she lets out a quiet, amused breath through her nose and keeps reading with the smile. Both eyes stay level and symmetrical, pupils aimed at the phone, and her facial proportions stay unchanged; she never looks into the lens. Her lips stay closed; she does not speak. The camera pushes in with small amplitude at slow speed toward her face. There is no text and no subtitle anywhere in the frame.

